<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вікторина</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Вікторина</h1>
        <nav>
            <a href="#current-question">Питання</a>
            <a href="#history">Результати</a>
        </nav>
    </header>
    
    <main>
        <!-- Блок поточного питання й варіантів відповіді -->
<section id="current-question">
            <h2>Поточне питання</h2>
            <p>Якою мовою написане питання?</p>

    <div class="options">
    <input type="radio" id="answer1" name="question1" checked>
    <label for="answer1" class="correct">українською <span class="status-icon">✓</span></label>

    <input type="radio" id="answer2" name="question1">
    <label for="answer2" class="incorrect">ukrainian <span class="status-icon">✗</span></label>

    <input type="radio" id="answer3" name="question1">
    <label for="answer3">ukrainisch <span class="status-icon"></span></label>

    <input type="radio" id="answer4" name="question1">
    <label for="answer4">ucraino <span class="status-icon"></span></label>
    </div>
</section>
    

    <!-- Блок прогресу проходження -->
     <section id="progress">
        <!-- <h2>Прогрес проходження</h2> -->
        <p class="question-number">Питання 1 <span class="total">/ 10</span></p>
    <div class="progress-bar">
        <div class="progress-fill" style="width: 10%;"></div>
    </div>
     </section>

    <!-- Блок результатів/історії спроб -->
     <section id="history">
            <h2>Історія спроб</h2>
            
        <div class="history-grid">
            <article>
            <h3>Спроба 1: 15.09.26 &emsp; 19:00</h3>
            <p>Результат: 10/10 балів</p>
            </article>

            <article>
            <h3>Спроба 2: 15.09.26 &emsp; 19:40</h3>
            <p>Результат: 1/10 балів</p>
            </article>

            <article>
            <h3>Спроба 3: 15.09.26 &emsp; 23:23</h3>
            <p>Результат: 8/10 балів</p>
            </article>
        </div>
     </section>
     </main>

    <!-- Підвал -->
     <footer>
        <p>&copy; 2026 Карась Єгор</p>
     </footer>
    <script src="js/app.js"></script>
</body>
</html>
